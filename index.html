    var lastSet = L.sets[L.sets.length-1];
    var wSide = lastSet[0] > lastSet[1] ? "a" : "b";
    if(L.phase==="done"){
      var mw = L.setsWon.a > L.setsWon.b ? "a" : "b";
      $("loEyebrow").textContent = "Match";
      $("loWho").innerHTML = icon("trophy",20) + " " + esc(liveEntName(mw));
      $("loScore").textContent = fmtSets(L.sets);
      $("loNext").textContent = "Save result";
    } else {
      $("loEyebrow").textContent = "Set " + L.sets.length;
      $("loWho").textContent = liveEntName(wSide);
      $("loScore").textContent = lastSet[0] + "–" + lastSet[1] + "  ·  sets " + L.setsWon.a + "–" + L.setsWon.b;
      $("loNext").textContent = "Start set " + (L.sets.length+1) + " →";
    }
    ov.classList.add("show");
  } else {
    ov.classList.remove("show");
  }
}

var CRC_T = (function(){
  var t = [], c;

function crc32(u8){

    dv.setUint16(26, nameB.length, true);

    dv2.setUint16(28, nameB.length, true);
    dv2.setUint32(42, offset, true);

function xlsxBlob(sheets){ // sheets: [{name, rows:[[v,...],...]}]

function triggerDownload(name, blob){
  function fallback(){
    var a = document.createElement("a");

    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  // On claude.ai the viewer sandbox blocks direct downloads; the downloads
  // capability offers the file through the platform instead.
  var cl = window.claude;
  if(cl && typeof cl.use === "function"){
    cl.use("downloads").then(function(dl){
      if(!dl){ fallback(); return; }
      dl.save({ filename:name, data:blob }).catch(function(err){
        if(err && (err.code==="declined" || err.code==="rate_limited")) return;
        fallback();
      });
    }, fallback);
  } else {
    fallback();
  }
}

  var structLabel = { league:"Round robin", league_ko:"Groups + knockout", ko:"Knockout" }[f.structure];
  var h = '<div class="report-sheet">';
  h += '<div class="rp-h2">'+esc(C.name)+(C.ageCap? " · under "+C.ageCap : "")+'</div>';
  h += '<p class="rp-sub">'+discLabel+' · '+structLabel
    + (f.structure!=="ko" ? ' · league '+fmtCfg(f.league) : "")
    + (f.structure!=="league" ? ' · final '+fmtCfg(f.ko.f) : "")+'</p>';
  var fin = C.matches.filter(function(m){ return m.stage==="f"; })[0];
  if(fin && fin.done){
    h += '<div class="rp-champ"><span class="cc">'+icon('trophy',26)+'</span><div><div class="rp-sub" style="margin:0">Champion</div><b>'+esc(entName(C, resolveSide(C, fin, fin.winner)))+'</b></div></div>';
  }
  if(C.groups && C.groups.length){
    C.groups.forEach(function(gr){
      var st = groupStandings(C, gr);
      h += '<div class="rp-h3">'+(C.groups.length>1 ? "Group "+esc(gr.name)+" — standings" : "Standings")+'</div>';
      h += '<table class="rp-table"><tr><th>#</th><th>Entrant</th><th class="num">P</th><th class="num">W</th><th class="num">L</th><th class="num">Sets</th><th class="num">Pts +</th><th class="num">Pts −</th><th class="num">Diff</th></tr>';
      st.forEach(function(s, i){
        var qual = f.structure==="league_ko" && i < f.qualify;
        h += '<tr class="'+(qual?"q":"")+'"><td>'+(i+1)+'</td><td class="'+(qual?"rp-win":"")+'">'+esc(entName(C,s.id))+'</td>'
          + '<td class="num">'+s.p+'</td><td class="num">'+s.w+'</td><td class="num">'+s.l+'</td>'
          + '<td class="num">'+s.sw+'–'+s.sl+'</td><td class="num">'+s.pf+'</td><td class="num">'+s.pa+'</td>'
          + '<td class="num">'+(s.pf-s.pa>0?"+":"")+(s.pf-s.pa)+'</td></tr>';
      });
      h += '</table>';
      if(f.structure==="league_ko") h += '<p class="rp-sub" style="margin:6px 0 0">Highlighted rows qualify for the knockout.</p>';
    });
    var rounds = {};
    C.matches.forEach(function(m){
      if(m.stage!=="league") return;
      (rounds[m.group+"·"+m.round] = rounds[m.group+"·"+m.round] || []).push(m);
    });
    h += '<div class="rp-h3">League fixtures</div>';
    h += '<table class="rp-table"><tr><th>Grp·Rnd</th><th>Match</th><th>Court</th><th>Referee</th><th>Result</th><th>Status</th></tr>';
    C.matches.forEach(function(m){
      if(m.stage!=="league") return;
      h += reportFixRow(T, C, m, m.group+" · R"+m.round);
    });
    h += '</table>';
  }
  var ko = C.matches.filter(function(m){ return m.stage!=="league"; });
  if(ko.length){
    h += '<div class="rp-h3">Knockout</div>';
    h += '<table class="rp-table"><tr><th>Stage</th><th>Match</th><th>Court</th><th>Referee</th><th>Result</th><th>Status</th></tr>';
    ko.sort(function(a,b){ return a.koRound-b.koRound || a.slot-b.slot; }).forEach(function(m){
      h += reportFixRow(T, C, m, stageLabel(m.stage));
    });
    h += '</table>';
  }
  h += '<div class="rp-foot"><span>'+esc(T.name||"Untitled")+(T.venue? ' · '+esc(T.venue):"")+'</span><span>Rally Point · '+esc(new Date().toLocaleDateString())+'</span></div>';
  h += '</div>';
  return h;
}
function reportFixRow(T, C, m, label){
  var ea = resolveSide(C,m,"a"), eb = resolveSide(C,m,"b");
  var na = ea? entName(C,ea) : (m.srcA && m.srcA.t==="m" ? "Winner · "+stageLabel((matchById(C,m.srcA.id)||{}).stage||"") : "TBD");
  var nb = eb? entName(C,eb) : (m.srcB && m.srcB.t==="m" ? "Winner · "+stageLabel((matchById(C,m.srcB.id)||{}).stage||"") : "TBD");
  var ref = refById(T, m.ref);
  var result = m.walkover ? "walkover" : (m.done ? fmtSets(m.sets) : "—");
  var status = m.walkover ? '<span class="rp-status">Walkover</span>'
    : m.done ? '<span class="rp-status done">Completed</span>'
    : '<span class="rp-status">Pending</span>';
  var matchTxt = (m.done && m.winner==="a" ? '<span class="rp-win">'+esc(na)+'</span>' : esc(na))
    + ' <span style="color:#8A9089">vs</span> '
    + (m.done && m.winner==="b" ? '<span class="rp-win">'+esc(nb)+'</span>' : esc(nb));
  return '<tr><td>'+esc(label)+'</td><td>'+matchTxt+'</td><td>'+esc(m.court||"—")+'</td><td>'+esc(ref? ref.name : "—")+'</td><td>'+esc(result)+'</td><td>'+status+'</td></tr>';
}
function openReport(){
  var T = activeT();
  if(!T){ alert("Create a tournament first."); return; }
  var cats = T.cats.filter(function(c){ return (mCatFilter==="all" || c.id===mCatFilter) && c.matches.length; });
  if(!cats.length){ alert("No fixtures to report yet — generate fixtures for a category first."); return; }
  var done = 0, total = 0;
  cats.forEach(function(c){ c.matches.forEach(function(m){ total++; if(m.done) done++; }); });
  var h = '<div class="report-sheet">';
  h += '<div class="rp-band"><div class="rp-app">Rally Point · Fixtures &amp; standings</div>'
    + '<div class="rp-title">'+esc(T.name||"Untitled tournament")+'</div>'
    + '<div class="rp-meta">'+(T.venue? esc(T.venue)+' · ' : "")+T.courts.length+' court'+(T.courts.length===1?"":"s")
    + ' · '+cats.length+' categor'+(cats.length===1?"y":"ies")
    + ' · '+done+' of '+total+' matches completed · '+esc(new Date().toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}))+'</div></div>';
  h += '<table class="rp-table"><tr><th>Category</th><th>Discipline</th><th class="num">Entrants</th><th class="num">Matches</th><th class="num">Completed</th><th>Champion</th></tr>';
  cats.forEach(function(c){
    var ents = {};
    c.matches.forEach(function(m){
      if(m.srcA && m.srcA.t==="e" && m.srcA.id) ents[m.srcA.id]=1;
      if(m.srcB && m.srcB.t==="e" && m.srcB.id) ents[m.srcB.id]=1;
    });
    var cd=0;
    c.matches.forEach(function(m){ if(m.done) cd++; });
    var fin = c.matches.filter(function(m){ return m.stage==="f"; })[0];
    h += '<tr><td class="rp-win">'+esc(c.name)+(c.ageCap? " (U"+c.ageCap+")":"")+'</td>'
      + '<td>'+({singles:"Singles",doubles:"Doubles",mixed:"Mixed doubles"}[c.format.discipline])+'</td>'
      + '<td class="num">'+Object.keys(ents).length+'</td><td class="num">'+c.matches.length+'</td><td class="num">'+cd+'</td>'
      + '<td>'+(fin && fin.done ? '<span class="rp-win">'+esc(entName(c, resolveSide(c, fin, fin.winner)))+'</span>' : "—")+'</td></tr>';
  });
  h += '</table>';
  h += '<div class="rp-foot"><span>Generated from live tournament data</span><span>Rally Point</span></div>';
  h += '</div>';
  cats.forEach(function(c){ h += reportCatSheet(T, c); });
  $("reportPages").innerHTML = h;
  document.body.classList.add("report-open");
  $("reportEl").classList.add("show");
}
function closeReport(){
  document.body.classList.remove("report-open");
  $("reportEl").classList.remove("show");
}
$("repPrint").addEventListener("click", function(){ window.print(); });
$("repClose").addEventListener("click", closeReport);

/* ================= projector display ================= */
var displayMode = false;
function enterDisplay(){
  displayMode = true;
  if(location.hash !== "#display"){ try{ location.hash = "display"; }catch(e){} }
  $("displayEl").classList.add("show");
  renderDisplay();
}
function exitDisplay(){
  displayMode = false;
  $("displayEl").classList.remove("show");
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){ location.hash = ""; }
  renderView(currentView);
}
$("navDisplay").addEventListener("click", enterDisplay);
$("dispExit").addEventListener("click", exitDisplay);
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && displayMode) exitDisplay(); });

function displayStandTable(C, gr, multi){
  var st = groupStandings(C, gr);
  var title = esc(C.name) + (multi ? " · Group "+esc(gr.name) : (C.groups.length>1 ? " · Group "+esc(gr.name) : ""));
  var h = '<div class="d-panel"><div class="d-pt">'+title+'</div>';
  h += '<table class="d-stand"><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>Sets</th><th>Pts ±</th></tr>';
  st.forEach(function(s, i){
    var qual = C.format.structure==="league_ko" && i < C.format.qualify;
    h += '<tr class="'+(qual?"q":"")+'"><td class="tn">'+(i+1)+'&nbsp; '+esc(entName(C,s.id))+'</td><td>'+s.p+'</td><td>'+s.w+'</td><td>'+s.l+'</td><td>'+s.sw+'–'+s.sl+'</td><td>'+(s.pf-s.pa>0?"+":"")+(s.pf-s.pa)+'</td></tr>';
  });
  h += '</table></div>';
  return h;
}
function renderDisplay(){
  if(!displayMode) return;
  var T = liveT() || activeT();
  var h = '<div class="d-head"><div><div class="d-title">'+(T && T.name ? esc(T.name) : 'Rally Point')+'</div>'
    + (T && T.venue ? '<div class="d-venue">'+esc(T.venue)+'</div>' : "")
    + '</div><div class="d-liveflag" style="'+(S.live && S.live.phase!=="toss" ? "" : "display:none")+'">Live</div></div>';

  var L = S.live;
  if(L && L.phase!=="toss"){
    var LC = liveC();
    var m = matchById(LC, L.matchId);
    var servA = L.serve.side==="a" && L.phase==="play";
    var servB = L.serve.side==="b" && L.phase==="play";
    var subA = (L.discipline==="doubles" ? esc(livePlayerName("a",0))+" · "+esc(livePlayerName("a",1)) : "");
    var subB = (L.discipline==="doubles" ? esc(livePlayerName("b",0))+" · "+esc(livePlayerName("b",1)) : "");
    var setsLine = L.sets.length ? "sets " + fmtSets(L.sets) + " · " : "";
    h += '<div class="d-livecard">'
      + '<div class="d-ln"><div class="n">'+(servA?'<span class="d-servemark">'+icon('shuttle',24)+' </span>':"")+esc(liveEntName("a"))+'</div>'
      + (subA?'<div class="sub">'+subA+'</div>':"")
      + '<div class="sub">'+setsLine+"set "+(L.setNo+1)+" of "+L.bestOf+(m && m.court ? " · court "+esc(m.court) : "")+'</div></div>'
      + '<div class="d-bigscore">'+L.score.a+'<span class="dash">–</span>'+L.score.b+'</div>'
      + '<div class="d-ln rt"><div class="n">'+esc(liveEntName("b"))+(servB?'<span class="d-servemark"> '+icon('shuttle',24)+'</span>':"")+'</div>'
      + (subB?'<div class="sub">'+subB+'</div>':"")
      + '<div class="sub">'+esc(LC? LC.name+" · ":"")+stageLabel(m ? m.stage : "league")+'</div></div>'
      + '</div>';
  }

  h += '<div class="d-grid">';
  var any = false;
  if(T){
    T.cats.forEach(function(C){
      var fin = C.matches.filter(function(x){ return x.stage==="f"; })[0];
      if(fin && fin.done){
        any = true;
        h += '<div class="d-panel" style="grid-column:1/-1;text-align:center;border-color:rgba(217,164,65,0.55)">'
          + '<div style="color:var(--gold)">'+icon('trophy',36)+'</div><div class="d-pt" style="margin:0.6vh 0 0">'+esc(C.name)+' champion</div>'
          + '<div style="font-family:var(--disp);font-weight:700;font-size:clamp(22px,3.4vw,44px)">'+esc(entName(C, resolveSide(C, fin, fin.winner)))+'</div></div>';
      }
      if(C.groups && C.groups.length){
        any = true;
        C.groups.forEach(function(gr){ h += displayStandTable(C, gr, C.groups.length>1); });
      }
      var koMatches = C.matches.filter(function(x){ return x.stage!=="league"; });
      if(koMatches.length){
        any = true;
        h += '<div class="d-panel d-ko" style="grid-column:1/-1"><div class="d-pt">'+esc(C.name)+' · knockout</div><div class="bracket">';
        var rr = {};
        koMatches.forEach(function(x){ (rr[x.koRound] = rr[x.koRound] || []).push(x); });
        Object.keys(rr).sort(function(a,b){return a-b;}).forEach(function(r){
          var ms = rr[r].sort(function(a,b){ return a.slot-b.slot; });
          h += '<div class="b-round"><div class="b-rt">'+stageLabel(ms[0].stage)+'</div>';
          ms.forEach(function(x){
            h += '<div class="b-match">'+bracketSide(C,x,"a",resolveSide(C,x,"a"))+bracketSide(C,x,"b",resolveSide(C,x,"b"))+'</div>';
          });
          h += '</div>';
        });
        h += '</div></div>';
      }
    });
  }
  if(!any && !(L && L.phase!=="toss")){
    h += '<div class="d-empty" style="grid-column:1/-1">Waiting for fixtures…<br>Generate them from the tournament setup on the scoring device.</div>';
  }
  h += '</div>';
  $("displayBody").innerHTML = h;
}

window.addEventListener("storage", function(e){
  if(CLOUD) return; // cloud mode syncs through Firestore, not localStorage
  if(e.key !== KEY) return;
  load();
  delete S.__needsSeed;
  updateAuthUI();
  if(displayMode) renderDisplay();
  else renderView(currentView);
});
setInterval(function(){
  if(displayMode && !CLOUD){ load(); delete S.__needsSeed; renderDisplay(); }
}, 4000);

/* ================= boot ================= */
function bindAll(){
  bindToursStatic();
  bindPlayersStatic();
  bindMatchesStatic();
  bindUsersStatic();
  $("loginForm").addEventListener("submit", function(e){ e.preventDefault(); doLogin(); });
  $("navLogout").addEventListener("click", doLogout);
}
var __booted = false;
function bootLocal(){
  if(__booted) return; __booted = true;
  load();
  bindAll();
  if(S.__needsSeed){ seedDemo(); }
  delete S.__needsSeed;
  save();
  updateAuthUI();
  renderView("tournaments");
  if(S.live && can("score")){ goto_("live"); }
  if(location.hash === "#display"){ enterDisplay(); }
}

/* ---- cloud mode: Firestore is the source of truth ---- */
function applyCloudData(json){
  var d = null;
  try{ d = json ? JSON.parse(json) : null; }catch(e){}
  if(d){
    S.seq = d.seq || S.seq;
    S.players = d.players || [];
    S.tournaments = d.tournaments || [];
  } else {
    S.players = []; S.tournaments = [];
  }
  if(S.sel.t && !tourById(S.sel.t)) S.sel = { t:null, c:null };
  if(displayMode){ renderDisplay(); return; }
  renderView(currentView);
}
function applyCloudLive(json){
  var d = null;
  try{ d = json ? JSON.parse(json) : null; }catch(e){}
  S.live = d && d.matchId ? d : null;
  if(displayMode){ renderDisplay(); return; }
  if(currentView === "live") renderLive();
}
var __cloudSeeded = false;
function cloudMaybeSeed(){
  // first ever data on a fresh cloud system: seed the demo once, by the admin
  if(__cloudSeeded || !CLOUD || !can("users")) return;
  if(S.players.length || S.tournaments.length) return;
  __cloudSeeded = true;
  seedDemo();
  save();
  if(!displayMode) renderView(currentView);
}
function bootCloud(){
  if(__booted) return; __booted = true;
  S = freshState();
  bindAll();
  CLOUD.init().then(function(){
    CLOUD.start({
      onData: function(json){ applyCloudData(json); if(json == null) cloudMaybeSeed(); },
      onLive: function(json){ applyCloudLive(json); },
      onUsers: function(){ if(currentView==="users" && !displayMode) renderUsers(); },
      onAuth: function(){
        updateAuthUI();
        if(!displayMode) renderView(currentView);
      }
    });
    updateAuthUI();
    renderView("tournaments");
    if(location.hash === "#display"){ enterDisplay(); }
  });
}

if(window.__RALLY_CLOUD_EXPECTED){
  (window.__rallyCloudReady || Promise.resolve(null)).then(function(rc){
    if(rc && rc.enabled){ CLOUD = rc; bootCloud(); }
    else { bootLocal(); }
  });
  // if the SDK never loads (fully offline first visit), fall back after a timeout
  setTimeout(function(){ if(!__booted){ bootLocal(); } }, 6000);
} else {
  bootLocal();
}
})();
</script>
